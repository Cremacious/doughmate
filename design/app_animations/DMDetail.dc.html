<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width:390px;height:666px;background:#F7EFE1;border-top:2px solid #241611;border-radius:30px 30px 0 0;box-shadow:0 -12px 40px rgba(22,13,8,0.24);overflow:hidden;font-family:'Nunito Sans',sans-serif;position:relative">
  <div style="padding:18px 0 6px;display:flex;flex-direction:column;align-items:center">
    <div style="width:46px;height:6px;border-radius:999px;background:#C9B49A"></div>
    <div style="width:100%;padding:10px 18px 0;display:flex;flex-direction:row;align-items:flex-start;justify-content:space-between;gap:14px">
      <div style="display:flex;flex-direction:column;gap:2px;min-width:0">
        <div style="font-family:'Nunito Sans',sans-serif;font-weight:800;font-size:11px;line-height:15px;letter-spacing:1.5px;text-transform:uppercase;color:#2C7A70">Sourdough</div>
        <div style="font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:36px;line-height:38px;letter-spacing:-0.72px;color:#241611">Weeknight sourdough</div>
      </div>
      <div style="flex:0 0 auto;border-radius:999px;background:#FFFDF8;border:2px solid #241611;box-shadow:3px 3px 0 #241611;padding:10px 16px;font-family:'Nunito Sans',sans-serif;font-weight:800;font-size:14px;color:#241611">Edit</div>
    </div>
  </div>

  <div style="padding:14px 18px 0;display:flex;flex-direction:column;gap:14px">
    <div style="display:flex;flex-direction:row;gap:10px">
      <div style="flex:1;background:#EFE2CE;border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:2px"><div style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:22px;line-height:26px;color:#241611">5</div><div style="font-family:'Nunito Sans',sans-serif;font-weight:800;font-size:10.5px;line-height:14px;letter-spacing:1.4px;text-transform:uppercase;color:#9C8776">ingredients</div></div>
      <div style="flex:1;background:#EFE2CE;border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:2px"><div style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:22px;line-height:26px;color:#241611">7</div><div style="font-family:'Nunito Sans',sans-serif;font-weight:800;font-size:10.5px;line-height:14px;letter-spacing:1.4px;text-transform:uppercase;color:#9C8776">steps</div></div>
      <div style="flex:1;background:#EFE2CE;border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:2px"><div style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:22px;line-height:26px;color:#241611">1 loaf</div><div style="font-family:'Nunito Sans',sans-serif;font-weight:800;font-size:10.5px;line-height:14px;letter-spacing:1.4px;text-transform:uppercase;color:#9C8776">yield</div></div>
    </div>

    <div style="font-family:'Nunito Sans',sans-serif;font-weight:800;font-size:11px;line-height:15px;letter-spacing:1.5px;text-transform:uppercase;color:#6B5344">Scale</div>

    <div style="border-radius:26px;background:#FFC24B;border:2px solid #241611;box-shadow:5px 5px 0 #241611;padding:18px;display:flex;flex-direction:row;align-items:center;justify-content:space-between;gap:14px">
      <div style="font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:20px;line-height:24px;color:#241611">Serves</div>
      <div style="display:flex;flex-direction:row;align-items:center;gap:18px">
        <div style="width:44px;height:44px;border-radius:999px;background:#F7EFE1;border:2px solid #241611;display:flex;align-items:center;justify-content:center;font-family:'Nunito Sans',sans-serif;font-weight:800;font-size:22px;line-height:26px;color:#241611">−</div>
        <div style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:30px;line-height:34px;letter-spacing:-0.6px;color:#241611">2</div>
        <div style="width:44px;height:44px;border-radius:999px;background:#F7EFE1;border:2px solid #241611;display:flex;align-items:center;justify-content:center;font-family:'Nunito Sans',sans-serif;font-weight:800;font-size:22px;line-height:26px;color:#241611">+</div>
      </div>
    </div>

    <div style="font-family:'Nunito Sans',sans-serif;font-weight:800;font-size:11px;line-height:15px;letter-spacing:1.5px;text-transform:uppercase;color:#6B5344">Ingredients</div>
    <div style="border-radius:24px;background:#FFFDF8;border:2px solid #241611;padding:18px;display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;flex-direction:row;justify-content:space-between;gap:10px"><span style="font-size:15px;line-height:22px;color:#241611">Bread flour</span><span style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;color:#241611">500 g</span></div>
      <div style="height:1px;background:#EFE2CE"></div>
      <div style="display:flex;flex-direction:row;justify-content:space-between;gap:10px"><span style="font-size:15px;line-height:22px;color:#241611">Water</span><span style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;color:#241611">350 g</span></div>
      <div style="height:1px;background:#EFE2CE"></div>
      <div style="display:flex;flex-direction:row;justify-content:space-between;gap:10px"><span style="font-size:15px;line-height:22px;color:#241611">Levain</span><span style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;color:#241611">100 g</span></div>
    </div>
  </div>

  <div style="position:absolute;left:0;right:0;bottom:0;background:#FFFDF8;border-top:2px solid #241611;padding:14px 18px 44px;display:flex;flex-direction:column;gap:10px">
    <div style="display:flex;flex-direction:row;gap:10px;align-items:center">
      <div style="flex:1;height:54px;border-radius:16px;background:#F2603C;border:2px solid #241611;box-shadow:3px 3px 0 #241611;display:flex;align-items:center;justify-content:center;font-family:'Nunito Sans',sans-serif;font-weight:800;font-size:17px;color:#FFF9F4">Start baking</div>
      <div style="width:54px;height:54px;border-radius:16px;background:#FFFDF8;border:2px solid #241611;box-shadow:3px 3px 0 #241611;display:flex;align-items:center;justify-content:center;flex:0 0 auto">
        <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="#241611" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l3 2M9 3h6"></path></svg>
      </div>
    </div>
    <div style="height:54px;border-radius:16px;border:1.5px dashed #DCC9B2;display:flex;align-items:center;justify-content:center;font-family:'Nunito Sans',sans-serif;font-weight:800;font-size:17px;color:#6B5344">Log a bake</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:666}}"></script>
</body>
</html>
